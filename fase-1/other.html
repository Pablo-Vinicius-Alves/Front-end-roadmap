<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Form</title>
</head>

<body>
    <header>

    </header>

    <main>
        <form action="/pesquisa" method="post">
            <input type="text" name="q">
            <button type="submit">Pesquisar</button>
        </form>
        <form action="/cadastro" method="post">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
            <button type="reset">Resetar</button>
        </form>
        <label for="testo"></label>
        <textarea name="teste" id="testo" rows="4"> </textarea>

        <form action="./proximo.html">
            <label for="ass1"></label>
            <select name="assunto" id="ass1">
                <option value="Ajuda">Ajuda</option>
                <option value="Ruim">Ruim</option>
                <option value="Bom">Bom</option>
            </select>
            <button type="submit">Enviar</button>
        </form>

        <form id="principal" action="./proximo.html" method="post">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>
            <label for="ano">Ano de Nascimento</label>
            <input type="number" id="ano" name="ano" required>

            <label for="txt">Mensagem</label>
            <textarea name="txt" id="txt" rows="3"></textarea>

            <label for="curso">Curso</label>
            <select name="curso" id="curso">
                <option value="met">Metalurgia</option>
                <option value="ds">DS</option>
                <option value="adm">ADM</option>
            </select>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </main>

    <footer>

    </footer>
</body>

</html>
