<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório de JS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Laboratório de JS</h1>

        <section id="lista-secao">
            <h2>Lista de frutas</h2>
            <ul id="lista"></ul>
        </section>

        <section id="cards-secao">
            <h2>Cards</h2>
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
        </section>

        <section id="contador-secao">
            <h2>Contador</h2>
            <p id="contador">0</p>
            <button id="mais">+</button>
            <button id="menos">-</button>
            <button id="resetar">RESET</button>
        </section>

        <section id="form-secao">
            <h2>Formulário de teste</h2>
            <input type="text" id="username" placeholder="Digite algo">
            <button type="submit" id="btn">Enviar</button>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>

</html>
