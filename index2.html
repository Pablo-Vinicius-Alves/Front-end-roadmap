<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>

        <form id="page" action="#" method="post">

            <nav id="menu">
                <img id="princi" src="/images/social_14996694.png" alt="User imagem">
                <aside>
                    <h2>Sign in</h2>
                    <h3>Dont have account?</h3>
                    <a href="/index2.html">Sign Up!</a>
                </aside>
            </nav>

            <article>
                <div class="user">
                    <label for="username"></label>
                    <img src="/images/user.png" alt="usuario">
                    <input type="text" id="username" placeholder=" User" required>
                </div>

                <div class="senha">
                    <label for="passwrd"></label>
                    <img src="/images/cadeado.png" alt="cadeado">
                    <input type="password" id="passwrd" placeholder=" Password" required>
                </div>
            </article>


            <button type="submit">Login</button>

            <section>
                <div class="ulti">
                    <label for="remember">Remeber Me</label>
                    <input type="checkbox" id="remember">
                </div>

                <a href="/fase-1/other.html">Forgot Password?</a>
            </section>


        </form>
    </main>
</body>

</html>
