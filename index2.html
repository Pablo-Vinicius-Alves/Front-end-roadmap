<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>

        <form id="page" action="#" method="post">

            <nav id="menu">
                <img id="princi" src="/images/social_14996694.png" alt="User imagem">
                <aside>
                    <h2>Sign in</h2>
                    <h3>Dont have account?</h3>
                    <a href="/index2.html">Sign Up!</a>
                </aside>
            </nav>


            <section>
                <label for="username">UserName</label>
                <img src="/images/user_131563.png" alt="usuario">
                <input type="text" id="username" required>
                <label for="passwrd">Password</label>
                <img src="/images/padlock_5869542.png" alt="cadeado">
                <input type="password" id="passwrd" required>
            </section>

            <button type="submit">Login</button>
            <label for="remember">Remeber Me</label>
            <input type="checkbox" id="remember">

            <a href="/fase-1/other.html">Forgot Password?</a>
        </form>
    </main>
</body>

</html>
